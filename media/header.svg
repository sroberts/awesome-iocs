<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Network graph with one node flagged as an indicator of compromise">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#06090E" />
    </linearGradient>

    <!-- Beacon Glow -->
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4757" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FF4757" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF4757" stop-opacity="0" />
    </radialGradient>

    <!-- Node Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38EF7D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#11E466" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />
  <rect width="1200" height="320" fill="url(#dotGrid)" />

  <!-- Technical Axis & Framing Lines -->
  <g stroke="#30363D" stroke-width="1" stroke-dasharray="4 6" opacity="0.4">
    <line x1="120" y1="160" x2="1080" y2="160" />
    <line x1="600" y1="40" x2="600" y2="280" />
  </g>

  <!-- Outer Framing Reticle Marks -->
  <g stroke="#58A6FF" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 60 40 L 40 40 L 40 60" />
    <path d="M 1140 40 L 1160 40 L 1160 60" />
    <path d="M 40 260 L 40 280 L 60 280" />
    <path d="M 1160 260 L 1160 280 L 1140 280" />
  </g>

  <!-- Network Interconnect Lines (Telemetry / Graph) -->
  <g stroke="#30363D" stroke-width="1.2" opacity="0.7">
    <line x1="380" y1="160" x2="480" y2="110" />
    <line x1="380" y1="160" x2="450" y2="210" />
    <line x1="480" y1="110" x2="570" y2="160" />
    <line x1="450" y1="210" x2="570" y2="160" />
    <line x1="570" y1="160" x2="600" y2="160" />
    <line x1="600" y1="160" x2="680" y2="110" />
    <line x1="600" y1="160" x2="710" y2="210" />
    <line x1="680" y1="110" x2="810" y2="160" />
    <line x1="710" y1="210" x2="810" y2="160" />
  </g>

  <!-- Standard Infrastructure Nodes (Clean / Inert) -->
  <g fill="#161B22" stroke="#484F58" stroke-width="1.5">
    <circle cx="380" cy="160" r="5" />
    <circle cx="480" cy="110" r="4.5" />
    <circle cx="450" cy="210" r="4.5" />
    <circle cx="680" cy="110" r="4.5" />
    <circle cx="710" cy="210" r="4.5" />
    <circle cx="810" cy="160" r="5" />
  </g>

  <!-- Anomaly / Threat Indicator Section (Center Core) -->
  <!-- Alert Ambient Rings -->
  <circle cx="600" cy="160" r="88" fill="url(#alertGlow)" />
  <circle cx="600" cy="160" r="64" stroke="#FF4757" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.3" fill="none" />
  <circle cx="600" cy="160" r="44" stroke="#FF4757" stroke-width="1.2" stroke-dasharray="8 6" stroke-opacity="0.6" fill="none" />
  <circle cx="600" cy="160" r="24" stroke="#FF4757" stroke-width="1" stroke-opacity="0.4" fill="none" />

  <!-- Precision Crosshair on Compromised Indicator -->
  <g stroke="#FF4757" stroke-width="1.5" stroke-linecap="round">
    <line x1="600" y1="126" x2="600" y2="136" />
    <line x1="600" y1="184" x2="600" y2="194" />
    <line x1="566" y1="160" x2="576" y2="160" />
    <line x1="624" y1="160" x2="634" y2="160" />
  </g>

  <!-- The Flagged Indicator Node -->
  <circle cx="600" cy="160" r="7" fill="#FF4757" />
  <circle cx="600" cy="160" r="2.5" fill="#FFFFFF" />

  <!-- Threat Line Intercept Trajectory -->
  <path d="M 540 240 L 585 175" stroke="#FF4757" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="2 3" />
  <circle cx="540" cy="240" r="3" fill="#FF4757" fill-opacity="0.7" />
</svg>
